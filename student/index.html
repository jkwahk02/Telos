// Re-read the three views and the plan. The views do the arithmetic, so this
// is the only way to be sure the totals on screen match the database.
async function reqReload(){
  const sid = studentData.id;
  const [st, sum, cat, plan] = await Promise.all([
    sbGet(VW_REQ_STATUS,   `student_id=eq.${sid}&order=sort_order.asc`).catch(()=>reqItems),
    sbGet(VW_REQ_SUMMARY,  `student_id=eq.${sid}`).catch(()=>[]),
    sbGet(VW_REQ_CATEGORY, `student_id=eq.${sid}&order=sort_order.asc`).catch(()=>reqCats),
    sbGet(TBL_REQ_COURSE,
      `student_id=eq.${sid}&select=id,item_id,course_id,is_completed,term,credits_awarded,`
      + `courses(course_id,code,num,title,credits,discontinued)`).catch(()=>[]),
  ]);
  reqItems   = st || [];
  reqCats    = cat || [];
  reqSummary = (sum && sum[0]) || null;
  reqPlan    = (plan || []).map(r => ({
    id: r.id, item_id: r.item_id, course_id: r.course_id,
    is_completed: r.is_completed, term: r.term, credits_awarded: r.credits_awarded,
    code: r.courses?.code || '', num: r.courses?.num || '',
    title: r.courses?.title || r.course_id,
    credits: r.credits_awarded != null ? r.credits_awarded : (r.courses?.credits || 0),
    discontinued: !!r.courses?.discontinued,
  }));
  renderRequirements();
  if(currentPage === 'overview') renderOverview();
}

// Items flagged autoplan have a fixed course list the student cannot choose
// from — the six required Innovation Foundation courses. Seed them once so a
// first-time student sees a meaningful plan instead of an empty table.
async function seedAutoPlan(sid){
  const auto = reqItems.filter(r => r.autoplan && r.course_filter?.course_ids?.length);
  if(!auto.length) return;
  const have = new Set(reqPlan.map(p => p.course_id));
  const rows = [];
  auto.forEach(r => r.course_filter.course_ids.forEach(cid => {
    if(!have.has(cid)) rows.push({ student_id: sid, item_id: r.item_id, course_id: cid, is_completed: false });
  }));
  if(!rows.length) return;
  try{
    await sbInsert(TBL_REQ_COURSE, rows);
    const plan = await sbGet(TBL_REQ_COURSE,
      `student_id=eq.${sid}&select=id,item_id,course_id,is_completed,term,credits_awarded,`
      + `courses(course_id,code,num,title,credits,discontinued)`);
    reqPlan = (plan||[]).map(r => ({
      id: r.id, item_id: r.item_id, course_id: r.course_id,
      is_completed: r.is_completed, term: r.term, credits_awarded: r.credits_awarded,
      code: r.courses?.code || '', num: r.courses?.num || '',
      title: r.courses?.title || r.course_id,
      credits: r.credits_awarded != null ? r.credits_awarded : (r.courses?.credits || 0),
      discontinued: !!r.courses?.discontinued,
    }));
  }catch(e){ console.warn('autoplan seeding skipped:', e.message); }
}

function calcProfilePct(s){
  const filled=PROFILE_FIELDS.filter(f=>isFilled(s,f)).length;
  return Math.round(filled/PROFILE_FIELDS.length*100);
}
function isFilled(s,f){
  const tags=(s[f.tags]||[]);
  const text=(s[f.text]||'').trim();
  return tags.length>0||text.length>0;
}

    ['1st Major',esc(shortMajor(s.major1||''))],
    ...(s.major2?[['2nd Major',esc(shortMajor(s.major2))]]:[]),

    const chipHtml=f.chips.map(c=>`<div class="chip${tags.includes(c)?' on':''}"

    return `<div class="sec-card ${cardCls}" id="sec-${f.key}">

    studentData[textCol]=text;
    if(btn){btn.textContent='Save';btn.disabled=true;}  // ← 추가 (저장 완료 후 변경 없으므로 disabled 유지)

    renderOverview();

    if(status) status.textContent=`Failed: ${e.message}`;
    if(btn){btn.textContent='Save';btn.disabled=false;}
  }
}

async function saveStudentLog(meetingId){
  const reflection = document.getElementById(`reflection-${meetingId}`)?.value.trim()||'';
  const takeaway   = document.getElementById(`takeaway-${meetingId}`)?.value.trim()||'';
  const nextStep   = document.getElementById(`nextstep-${meetingId}`)?.value.trim()||'';
  const btn    = document.getElementById(`studentlog-btn-${meetingId}`);
  const status = document.getElementById(`studentlog-status-${meetingId}`);
  if(!reflection){showToast('Please write a reflection before saving.');return;}
  if(btn){btn.textContent='Saving…';btn.disabled=true;}
  const m = allMeetings.find(x=>x.id===meetingId);
  const existing = m?.student_log||null;
  try{
    if(existing){
      await sbPatch(TBL_STUDENT_LOG,'student_log_id',existing.student_log_id,{
        reflection, key_takeaway:takeaway, next_step:nextStep,
      });
      existing.reflection=reflection; existing.key_takeaway=takeaway; existing.next_step=nextStep;
      if(btn){btn.textContent='Save changes';btn.disabled=false;}
      if(status){status.textContent='Saved ✓';setTimeout(()=>{status.textContent='';},2500);}
      hideSlogEdit(meetingId);
    } else {
      const newLogId=`SL-${studentData.id}-${meetingId}`;
      const inserted=await sbInsert(TBL_STUDENT_LOG,{
        student_log_id:newLogId, student_id:studentData.id,
        meeting_id:meetingId, reflection, key_takeaway:takeaway, next_step:nextStep,
      });
      if(m) m.student_log=inserted?.[0]||{student_log_id:newLogId,reflection,key_takeaway:takeaway,next_step:nextStep};
      if(btn){btn.textContent='Save reflection';btn.disabled=false;}
      if(status){status.textContent='Saved ✓';setTimeout(()=>{status.textContent='';},2500);}
      showToast('Reflection saved');
      renderMeetings();
      return;
    }
    showToast('Saved');
  }catch(e){
    if(status) status.textContent=`Failed: ${e.message}`;
    if(btn){btn.textContent=existing?'Save changes':'Save reflection';btn.disabled=false;}
  }
}

function convertTime(timeStr, fromTz, toTz) {
  if (!fromTz || !toTz || fromTz === toTz) return null;
  try {
    const today = new Date().toLocaleDateString('en-CA', { timeZone: fromTz });
    return convertDateTime(today, timeStr, fromTz, toTz).time || null;
  } catch { return null; }
}

function convertDateTime(dateStr, timeStr, fromTz, toTz) {
  if (!fromTz || !toTz || fromTz === toTz) return { date: dateStr, time: timeStr };
  try {
    const [h, m] = timeStr.split(':').map(Number);
    // dateStr+timeStr을 fromTz 기준 시각으로 해석해서 UTC timestamp 구하기
    // 방법: 일단 UTC로 Date 만들고, fromTz offset만큼 역보정
    const utcApprox = new Date(`${dateStr}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00Z`);
    // utcApprox를 fromTz로 읽으면 몇 시인지 확인
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: fromTz,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
    const parts = fmt.formatToParts(utcApprox);
    const p = {};
    parts.forEach(x => { p[x.type] = x.value; });
    const tzH = parseInt(p.hour) % 24;
    const tzM = parseInt(p.minute);
    // fromTz에서 h:m이 되려면 utcApprox에서 얼마나 조정해야 하는지
    const diffMin = (h - tzH) * 60 + (m - tzM);
    const utcDate = new Date(utcApprox.getTime() + diffMin * 60000);
    const convertedTime = utcDate.toLocaleTimeString('en-US', {
      timeZone: toTz, hour: '2-digit', minute: '2-digit', hour12: false
    });
    const convertedDate = utcDate.toLocaleDateString('en-CA', { timeZone: toTz });
    return { date: convertedDate, time: convertedTime };
  } catch { return { date: dateStr, time: timeStr }; }
}

function formatShortDate(dateStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  return new Date(y, mo-1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
  
function tzAbbr(tz) {
  if (!tz) return '';
  try {
    return new Intl.DateTimeFormat('en-US', { 
      timeZone: tz, 
      timeZoneName: 'shortOffset'  // 항상 GMT-4, GMT+9 등
    }).formatToParts(new Date())
      .find(p => p.type === 'timeZoneName')?.value || tz;
  } catch { return tz; }
}

function tzLabel(tz) {
  if (!tz) return '';
  const offset = tzAbbr(tz);
  const name = tz.replace(/_/g, ' ');
  return `${name} <span class="tz-pill">${offset}</span>`;
}

function buildRequestForm(){
  const s=studentData;
  const myFaculty=allFaculty.filter(f=>f.email===s.advisor1_email||f.email===s.advisor2_email);
  const otherFaculty=allFaculty.filter(f=>!myFaculty.map(x=>x.email).includes(f.email));

  // ── slot helpers ──
  const stuTz = studentData?.timezone || STUDENT_TIMEZONE || null;
  function tToM(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
    
  function mToT(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
  function getOpts(sl){
    const s=tToM(sl.start_time),e=tToM(sl.end_time);
    const o=[];
    for(let t=s;t+meetingDuration<=e;t+=30)
      o.push({start:mToT(t),end:mToT(t+meetingDuration)});
    return o;
  }
  function isSel(dateStr,start){return selectedMeetingSlots.some(x=>x.dateStr===dateStr&&x.start===start);}
  function pickedCount(dateStr,opts){return opts.filter(o=>isSel(dateStr,o.start)).length;}

  // ── slot grid ──
  function buildSlotGrid(slots, slotFacTz){
    if(!slots.length) return '<div class="no-slots">No availability registered for this professor.</div>';
    const today=new Date();today.setHours(0,0,0,0);
    const withDates=[];const seen={};
    const todayFacStr = new Date().toLocaleDateString('en-CA', {timeZone: slotFacTz||'UTC'});
    const todayFac = new Date(todayFacStr + 'T12:00:00');
    const todayFacDay = new Date().toLocaleDateString('en-US', {timeZone: slotFacTz||'UTC', weekday: 'short'});
    const DAYMAP = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    const todayFacDow = DAYMAP[todayFacDay.slice(0,3)];
    for(let week=0;week<2;week++){
      slots.forEach(sl=>{
        const diff=(sl.day_of_week-todayFacDow+7)%7||(week===0?7:0);
        const d=new Date(todayFac);
        d.setDate(todayFac.getDate()+diff+week*7);
        const facDateStr=d.toISOString().slice(0,10);
        // 교수 timezone 기준 날짜+시간을 학생 timezone으로 변환
        const converted = convertDateTime(facDateStr, sl.start_time.slice(0,5), slotFacTz, stuTz);
        const stuDate = new Date(converted.date + 'T12:00:00');
        const key=facDateStr+'_'+sl.start_time;
        if(!seen[key]){seen[key]=true;withDates.push({...sl, date:stuDate, facDateStr, convertedStart:converted.time});}
      });
    }
    
    withDates.sort((a,b)=>a.date-b.date);
    const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const weeks={};
    withDates.forEach(sl=>{
      const d=new Date(sl.date);
      const sun=new Date(d);sun.setDate(d.getDate()-d.getDay());
      const wk=sun.toISOString().slice(0,10);
      if(!weeks[wk])weeks[wk]={sun,slots:[]};
      weeks[wk].slots.push(sl);
    });
    return Object.values(weeks).map(wk=>{
      const sunStr=wk.sun.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const sat=new Date(wk.sun);sat.setDate(wk.sun.getDate()+6);
      const satStr=sat.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const cols=DAYS.map((d,di)=>{
        const hd=`<div class="slot-day-hd">${d}</div>`;
        const daySlots=wk.slots.filter(sl=>new Date(sl.date).getDay()===di);
        if(!daySlots.length)return `<div class="slot-day-col">${hd}<div class="slot-cell-empty"></div></div>`;
        const cells=daySlots.map(sl=>{
          const dateStr = sl.date.toISOString().slice(0,10); // 이미 학생 tz 기준 날짜
          const dateLabel = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
          const opts=getOpts(sl);
          const pc=pickedCount(dateStr,opts);
          const dis=opts.length===0;
          const popId=`spop-${dateStr}-${sl.start_time.replace(':','')}`;
          const tRows=opts.map(o=>{
            const sel=isSel(dateStr,o.start);
            const stuConverted = convertDateTime(sl.facDateStr, o.start, slotFacTz, stuTz);
            const stuEndConverted = convertDateTime(sl.facDateStr, o.end, slotFacTz, stuTz);
            const stuDateChanged = slotFacTz && stuTz && slotFacTz !== stuTz && stuConverted.date && stuConverted.date !== dateStr;
            const facEndConverted = convertDateTime(dateStr, o.end, stuTz, slotFacTz);
            const facDateChanged = sl.facDateStr !== dateStr;
            return `<div class="spop-row ${sel?'sel':''}"
                          onmouseenter="this.classList.add('hov')" onmouseleave="this.classList.remove('hov')"
                          onclick="toggleMeetingSlot('${stuConverted.date||dateStr}','${stuConverted.time||o.start}','${stuEndConverted.time||o.end}','${formatShortDate(stuConverted.date||dateStr)}','${o.start}','${o.end}','${sl.facDateStr}');event.stopPropagation()">
                          <div class="spop-bar"></div>
                          <div class="spop-lbl">${stuConverted.time||o.start}</div>
                          <div class="spop-tz">
                <div class="spop-tz-line">
                  <span class="tz-pill">${tzAbbr(stuTz)||'local'}</span>
                  ${stuDateChanged ? `<span style="font-size:11px;color:var(--text2);margin-right:2px;">${formatShortDate(stuConverted.date)} ·</span>` : ''}
                  ${stuConverted.time||o.start}–${stuEndConverted.time||o.end}
                </div>
                ${slotFacTz&&slotFacTz!==stuTz?`<div class="spop-tz-line">
                  <span class="tz-pill">${tzAbbr(slotFacTz)}</span>
                  ${facDateChanged ? `<span style="font-size:11px;color:var(--text2);margin-right:2px;">${formatShortDate(sl.facDateStr)} ·</span>` : ''}
                  ${o.start}–${o.end}
                </div>`:''}
              </div>
              <div class="spop-chk"><svg width="7" height="7" viewBox="0 0 10 10"><polyline points="2,5 4,7 8,3" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>`;
          }).join('');
          return `<div class="slot-cell ${pc?'on':''} ${dis?'disabled':''}"
            onclick="${dis?'':` toggleSlotPop('${popId}');event.stopPropagation()`}">
            <div class="slot-cell-num">${new Date(sl.date).getDate()}</div>
            <div class="slot-cell-time">
              ${convertDateTime(sl.facDateStr, sl.start_time.slice(0,5), slotFacTz, stuTz).time || sl.start_time.slice(0,5)}<br>
              ${convertDateTime(sl.facDateStr, sl.end_time.slice(0,5),   slotFacTz, stuTz).time || sl.end_time.slice(0,5)}
            </div>
            <div class="slot-cell-tz">${tzAbbr(stuTz)||tzAbbr(slotFacTz)}</div>
            ${pc?`<div class="s-picked" style="font-size:9px;color:#0F6E56;font-weight:600;margin-top:1px;">${pc} picked</div>`:''}
            ${!dis?`<div class="slot-popover" id="${popId}">
              <div class="spop-hd"><div class="spop-date">${dateLabel} · ${convertTime(sl.start_time,slotFacTz,stuTz)||sl.start_time.slice(0,5)}–${convertTime(sl.end_time,slotFacTz,stuTz)||sl.end_time.slice(0,5)} ${tzAbbr(stuTz)?`<span class="tz-pill">${tzAbbr(stuTz)}</span>`:''}</div>
              <div class="spop-hint">Choose start time (${meetingDuration} min)</div></div>
              <div class="spop-body">${tRows}</div>
            </div>`:''}
          </div>`;
        }).join('');
        return `<div class="slot-day-col">${hd}${cells}</div>`;
      }).join('');
      return `<div class="week-block"><div class="week-lbl">Week of ${sunStr} – ${satStr}</div><div class="slot-grid">${cols}</div></div>`;
    }).join('');
  }

  // ── duration chips ──
  const durChips=[30,60,90,120].map(m=>{
    const lbl=m===30?'30 min':m===60?'1 hour':m===90?'1.5 hours':'2 hours';
    return `<button class="dur-chip ${meetingDuration===m?'on':''}"
      onclick="meetingDuration=${m};selectedMeetingSlots=[];renderMeetings();event.stopPropagation()">${lbl}</button>`;
  }).join('');

  // ── selected summary ──
  const facTz = selectedFacultyEmail
    ? (allFaculty.find(f=>f.email===selectedFacultyEmail)?.timezone || null)
    : null;
  const selSummary=selectedMeetingSlots.length?`
      <div>
        <div class="fta-lbl" style="margin-bottom:6px;">Your proposed times</div>
        <div class="req-sel-list">
          ${selectedMeetingSlots.map((s,i)=>`
            <div class="req-sel-item">
              <div class="req-sel-dot"></div>
              <div style="flex:1;">
                <div class="spop-tz" style="text-align:left;">
                  <div class="spop-tz-line" style="justify-content:flex-start;color:var(--text);font-size:12px;font-weight:500;">
                    <span class="tz-pill">${tzAbbr(stuTz)||'local'}</span>
                    ${formatShortDate(s.dateStr)} · ${s.start}–${s.end}
                  </div>
                  ${facTz&&facTz!==stuTz?`<div class="spop-tz-line" style="justify-content:flex-start;">
                    <span class="tz-pill">${tzAbbr(facTz)}</span>
                    ${formatShortDate(s.facDateStr)} · ${s.facStart.slice(0,5)}–${s.facEnd.slice(0,5)}
                  </div>`:''}
                </div>
              </div>
              <button class="req-sel-rm" onclick="selectedMeetingSlots.splice(${i},1);renderMeetings()">× Remove</button>
            </div>`).join('')}
        </div>
      </div>`:'' ;

  // ── PATH A: preselected ──
  if(selectedFacultyEmail){
    const fac=allFaculty.find(f=>f.email===selectedFacultyEmail);
    const slots=availMap[selectedFacultyEmail]||[];
    const facIdx=myFaculty.findIndex(f=>f.email===selectedFacultyEmail);
    const avBg=facIdx===0?'var(--teal-l)':facIdx===1?'var(--blue-l)':'var(--amber-l)';

    const chairBadge=fac?.is_chair?`<span class="bdg bdg-blue" style="font-size:9px;">Chair</span>`:'';
    return `<div class="card accent-teal" style="margin-bottom:12px;">
      <div class="card-hd teal-bg">
        <div><div class="card-title" style="color:#085041;">  
          ${editingRequestId ? 'Edit meeting request' : 'New meeting request'}
        </div></div>
        <button class="btn-sm-out" onclick="closeRequestForm()">Cancel ×</button>
      </div>

// ── slot popover helpers ──
function toggleSlotPop(id){
  const el=document.getElementById(id);
  if(!el)return;
  const isOpen=el.classList.contains('open');
  document.querySelectorAll('.slot-popover.open').forEach(p=>p.classList.remove('open'));
  if(!isOpen)el.classList.add('open');
}
function toggleMeetingSlot(dateStr, start, end, dateLabel, facStart, facEnd, facDateStr) {
  const idx = selectedMeetingSlots.findIndex(x => x.dateStr===dateStr && x.start===start);
  if (idx>=0) selectedMeetingSlots.splice(idx,1);
  else selectedMeetingSlots.push({dateStr, start, end, dateLabel, facStart: facStart||start, facEnd: facEnd||end, facDateStr: facDateStr||dateStr});
  document.querySelectorAll('.slot-popover.open').forEach(p=>p.classList.remove('open'));
  renderMeetings();
}

// 신규 함수 — openEditRequest
function openEditRequest(meetingId){
  const m = scheduledMeetings.find(x => x.id === meetingId);
  if (!m) return;
  // request form을 edit 모드로 열기
  editingRequestId      = meetingId;
  requestFormOpen       = true;
  selectedFacultyEmail  = m.faculty_email;
  meetingDuration       = m.meeting_duration || 60;
  // 기존 proposed_slots를 selectedMeetingSlots로 복원
  const existing = m.proposed_slots
    ? (typeof m.proposed_slots==='string' ? JSON.parse(m.proposed_slots) : m.proposed_slots)
    : [];
  selectedMeetingSlots = existing;
  renderMeetings();
  setTimeout(()=>{
    const form=document.querySelector('.card.accent-teal');
    if(form) form.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
}
  
function selectRequestFaculty(email){
  selectedFacultyEmail=email;
  selectedMeetingSlots=[];
  renderMeetings();
}


async function saveAgenda(meetingId){
  const ta=document.getElementById(`agenda-ta-${meetingId}`);
  const btn=document.getElementById(`agenda-btn-${meetingId}`);
  const status=document.getElementById(`agenda-status-${meetingId}`);
  if(!ta) return;
  if(btn){btn.textContent='Saving…';btn.disabled=true;}
  try{
    await sbPatch(TBL_MEETING,'id',meetingId,{student_agenda:ta.value.trim()});
    const m=scheduledMeetings.find(x=>x.id===meetingId);
    if(m) m.student_agenda=ta.value.trim();
    const viewEl=document.getElementById(`agenda-view-${meetingId}`);
    const editEl=document.getElementById(`agenda-edit-${meetingId}`);
    const agendaTxt=viewEl?.querySelector('.agenda-txt');
    if(agendaTxt) agendaTxt.innerHTML=m?.student_agenda?esc(m.student_agenda):'<span style="color:var(--text3);font-style:italic;">No agenda set yet</span>';
    if(editEl) editEl.style.display='none';
    if(viewEl) viewEl.style.display='block';
    if(btn){btn.textContent='Save agenda';btn.disabled=true;}
    if(status){status.textContent='Saved ✓';setTimeout(()=>{status.textContent='';},2500);}
    showToast('Agenda saved');
  } catch(e){
    if(status) status.textContent=`Failed: ${e.message}`;
    if(btn){btn.textContent='Save agenda';btn.disabled=false;}
  }
}

async function submitRequest(){
  const agenda=document.getElementById('req-agenda')?.value.trim()||'';
  const type=document.getElementById('req-type')?.value||'Regular';
  // DOM 쿼리 대신 상태 변수 사용 (버그 수정)
  if(!selectedFacultyEmail){showToast('Please select a faculty member.');return;}
  if(!selectedMeetingSlots.length){showToast('Please select at least one available slot.');return;}
  if(!agenda){showToast('Please add an agenda.');return;}
  showToast('Submitting request…');
  try{
    const row={
      student_id:studentData.id,
      faculty_email:selectedFacultyEmail,
      meeting_date:selectedMeetingSlots[0].dateStr, // 첫 번째 제안 날짜
      meeting_format: document.getElementById('req-format')?.value || 'Zoom',
      meeting_type:type,
      meeting_duration:meetingDuration,
      proposed_slots:JSON.stringify(selectedMeetingSlots),
      status:'scheduled',
      advisor_confirmed:false,
      created_by:'student',
      student_agenda:agenda,
    };
    const result=await sbInsert(TBL_MEETING,row);
    scheduledMeetings.push(result[0]||row);
    requestFormOpen=false;
    selectedFacultyEmail=null;
    selectedMeetingSlots=[];
    meetingDuration=60;
    renderMeetings();
    showToast('✓ Request submitted — awaiting confirmation');
  }catch(e){
    showToast(`Submit failed: ${e.message}`);
  }
}

async function withdrawRequest(meetingId){
  if(!confirm('Withdraw this meeting request?')) return;
  try{
    await sbPatch(TBL_MEETING,'id',meetingId,{status:'cancelled'});
    scheduledMeetings=scheduledMeetings.filter(m=>m.id!==meetingId);
    renderMeetings();
    showToast('Request withdrawn');
  }catch(e){
    showToast(`Failed: ${e.message}`);
  }
}

// saveEditRequest 교체 — slots까지 저장
async function saveEditRequest(meetingId) {
  const m = scheduledMeetings.find(x => x.id === meetingId);
  if (!m) return;
  const agenda = document.getElementById('req-agenda')?.value.trim() || '';
  if (!selectedMeetingSlots.length) { showToast('Please select at least one slot.'); return; }

  const isRescheduling = m.status === 'rescheduling' || m.advisor_confirmed === true;
  
  const patch = {
    student_agenda:   agenda,
    meeting_duration: meetingDuration,
    proposed_slots:   JSON.stringify(selectedMeetingSlots),
    meeting_format:   document.getElementById('req-format')?.value || 'Zoom',
    ...(isRescheduling ? {
      status:            'scheduled',
      created_by:        'student',
      advisor_confirmed: false,
    } : {}),
  };

  try {
    await sbPatch(TBL_MEETING, 'id', meetingId, patch);
    m.student_agenda     = agenda;
    m.meeting_duration   = meetingDuration;
    m.proposed_slots     = selectedMeetingSlots;
    if (isRescheduling) {
      m.status            = 'scheduled';
      m.created_by        = 'student';
      m.advisor_confirmed = false;
//      m.meeting_date      = null;
    }
    editingRequestId     = null;
    requestFormOpen      = false;
    selectedFacultyEmail = null;
    selectedMeetingSlots = [];
    renderMeetings();
    renderOverview();
    showToast(isRescheduling ? 'New time proposed — waiting for advisor confirmation' : 'Request updated');
  } catch(e) {
    showToast(`Update failed: ${e.message}`);
  }
}

async function acceptAdvisorSlot(meetingId, slotIdx) {
  const m = scheduledMeetings.find(x => x.id === meetingId);
  if (!m) return;
  const slots = m.proposed_slots
    ? (typeof m.proposed_slots === 'string' ? JSON.parse(m.proposed_slots) : m.proposed_slots)
    : [];
  const sl = slots[slotIdx];
  if (!sl) return;
  if (!confirm(`Accept meeting on ${sl.dateLabel || sl.dateStr} ${sl.start}–${sl.end}?`)) return;
  try {
    await sbPatch(TBL_MEETING, 'id', meetingId, {
      advisor_confirmed: true,
      meeting_date:      sl.dateStr,
      status:            'scheduled',
    });
    m.advisor_confirmed = true;
    m.meeting_date = sl.dateStr;
    renderMeetings();
    renderOverview();
    showToast(`✓ Meeting confirmed — ${sl.dateLabel || sl.dateStr} ${sl.start}`);
  } catch(e) {
    showToast(`Failed: ${e.message}`);
  }
}

async function saveSettings() {
  const tz   = document.getElementById('stu-tz-select')?.value;
  const name = document.getElementById('stu-name')?.value.trim();
  if (!name) { showToast('Name cannot be empty.'); return; }
  const btn = document.getElementById('btn-save-settings');
  const status = document.getElementById('stu-save-status');
  if (btn) { btn.textContent = 'Saving…'; btn.disabled = true; }
  try {
    await sbPatch(TBL_STUDENTS, 'id', studentData.id, { timezone: tz, name_en: name });
    studentData.timezone = tz;
    studentData.name_en  = name;
    STUDENT_TIMEZONE = tz;
    document.getElementById('nav-name').textContent   = name;
    document.getElementById('nav-avatar').textContent = initials(name);
    document.getElementById('dd-name').textContent    = name;
    if (status) { status.textContent = 'Saved ✓'; setTimeout(() => { status.textContent = ''; }, 2500); }

  } finally {

// ── CROSS-PAGE NAV ──
function goToProfile(){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.page==='profile'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-profile').classList.add('active');
  currentPage='profile';renderProfile();
}
function goToMeetings(){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.page==='meetings'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-meetings').classList.add('active');
  currentPage='meetings';renderMeetings();
}

// ── USER MENU ──
function toggleUserMenu(){document.getElementById('nav-dropdown').classList.toggle('open');}
function closeUserMenu(){document.getElementById('nav-dropdown').classList.remove('open');}
// slot popover 외부 클릭 시 닫기
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.slot-cell')){
    document.querySelectorAll('.slot-popover.open').forEach(p=>p.classList.remove('open'));
  }
});
document.addEventListener('click',(e)=>{
  const btn=document.getElementById('nav-user-btn');
  const dd=document.getElementById('nav-dropdown');
  if(dd&&btn&&!btn.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open');
});
